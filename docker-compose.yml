services:
  backend-ai:
    build: ./backend_ai
    container_name: omnichat-ai
    ports:
      - "8000:8000"
    env_file:
      - ./backend_ai/.env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: "False"
    volumes:
      - ./backend_ai/data:/app/data
      - ./backend_ai/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build: ./backend
    container_name: omnichat-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
      NODE_ENV: production
      # Di dalam Docker, backend panggil AI via nama service
      RAG_API_URL: http://backend-ai:8000
      FRONTEND_URL: http://localhost:3000
    depends_on:
      backend-ai:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001
        VITE_RAG_API_URL: http://localhost:8000
        VITE_SOCKET_URL: http://localhost:3001
    container_name: omnichat-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
      - backend-ai
    restart: unless-stopped
